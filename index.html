  const cl=e.target.closest("[data-cls]");if(cl){openClassDay(cl.dataset.cls,cl.dataset.date);return}
  const sc=e.target.closest("[data-sdate]");if(sc&&!e.target.closest(".sblk")){const r=sc.getBoundingClientRect();const m0=+sc.dataset.ssh*60+Math.floor(((e.clientY-r.top)/PXM)/30)*30;const bl=bellsList().map(b=>b.split("-")).find(b=>toMin(b[0])<=m0+29&&toMin(b[1])>m0);openClass(null,{date:sc.dataset.sdate,mode:"once",start:bl?bl[0]:fromMin(m0),end:bl?bl[1]:fromMin(Math.min(m0+90,23*60+59))});return}
  const rs=e.target.closest("[data-restore]");if(rs){const raw=await API.readBackup(rs.dataset.restore);if(raw)applyImported(raw,"В копии");return}
  const gb=e.target.closest("[data-goboard]");if(gb)return go("board-"+gb.dataset.goboard);
  if(e.target.closest("#side")||e.target.closest(".modal"))return;
  const op=e.target.closest("[data-open]");if(op){openTask(task(op.dataset.open));return}
  const tlc=e.target.closest(".tl");if(tlc&&!e.target.closest(".blk")){const r=tlc.getBoundingClientRect();const m0=+tlc.dataset.sh*60+Math.floor(((e.clientY-r.top)/PXM)/30)*30;openTask(null,{plan:tlc.dataset.tl,time:fromMin(m0)});return}
  const hr=e.target.closest(".hour");if(hr&&!e.target.closest(".ev")){openTask(null,{plan:ui.day,time:pad(hr.dataset.hour)+":00"});return}
  const cd=e.target.closest("[data-cal]");if(cd){ui.calSel=cd.dataset.cal;if(cd.dataset.cal.slice(0,7)!==ui.calMonth)ui.calMonth=cd.dataset.cal.slice(0,7);render();return}
  const ls=e.target.closest("#lst [data-st]");if(ls){ui.fStatus=ls.dataset.st;render();return}
  const th=e.target.closest("#sTheme [data-th]");if(th){state.settings.theme=th.dataset.th;commit();return}
});
document.addEventListener("dblclick",e=>{const r=e.target.closest("[data-rencol]");if(r){ui.editCol=r.dataset.rencol;render()}});
document.addEventListener("input",e=>{if(e.target.id==="lq"){ui.q=e.target.value;render()}});
document.addEventListener("change",async e=>{
  if(e.target.id==="lboard"){ui.fBoard=e.target.value;render()}
  if(e.target.id==="sName"){state.settings.name=e.target.value.trim();commit()}
  if(e.target.id==="sSem"&&e.target.value){state.settings.semesterStart=e.target.value;commit()}
  if(e.target.dataset&&e.target.dataset.rvdate&&e.target.value){const tk=task(e.target.dataset.rvdate);if(tk){reschedule(tk,"date",e.target.value);commit();toast("Перенесено на "+fmtShort(e.target.value),"paw")}}
  if(e.target.id==="sAuto"&&API){autoCache=await API.setAutostart(e.target.checked);render();toast(autoCache?"Планер будет запускаться вместе с "+OSN:"Автозапуск выключен","moon")}
});
document.addEventListener("submit",e=>{if(e.target.id==="qcls"){e.preventDefault();const v=$("#qclsIn").value.trim();if(v&&quickAddClass(v)){const i=$("#qclsIn");if(i){i.value="";i.focus()}}return}
  const f=e.target.closest("[data-kadd]");if(!f)return;e.preventDefault();const inp=f.querySelector("input"),v=inp.value.trim();if(!v)return;
  const t=newTask({title:v,boardId:ui.board,colId:f.dataset.kadd});const sib=state.tasks.filter(x=>x.colId===f.dataset.kadd);t.order=sib.length?Math.max(...sib.map(x=>x.order??0))+1:0;state.tasks.push(t);commit();
  setTimeout(()=>{const n=document.querySelector(`[data-kadd="${f.dataset.kadd}"] input`);n&&n.focus()},0)});
function finishColRename(el,save){const b=board(ui.board);const c=b&&b.columns.find(x=>x.id===el.dataset.colid);ui.editCol=null;if(c&&save&&el.value.trim())c.name=el.value.trim();commit()}
document.addEventListener("keydown",e=>{if(e.target.id==="colName"){if(e.key==="Enter")finishColRename(e.target,true);if(e.key==="Escape"){e.stopPropagation();finishColRename(e.target,false)}}},true);
document.addEventListener("focusout",e=>{if(e.target.id==="colName"&&ui.editCol)finishColRename(e.target,true)});

/* =================== drag & drop =================== */
let drag=null;
document.addEventListener("dragstart",e=>{const el=e.target.closest&&e.target.closest("[data-drag]");if(!el)return;drag={id:el.dataset.drag,kind:el.dataset.kind||"plan"};el.classList.add("dragging");e.dataTransfer.effectAllowed="move";try{e.dataTransfer.setData("text/plain",drag.id)}catch(_){}});
const clearDrop=()=>document.querySelectorAll(".drop,.ins").forEach(x=>x.classList.remove("drop","ins"));
document.addEventListener("dragend",e=>{document.querySelectorAll(".dragging").forEach(x=>x.classList.remove("dragging"));drag=null;clearDrop()});
const tgtOf=e=>e.target.closest&&e.target.closest("[data-col],[data-cal],[data-tl],[data-hour],[data-dropday],[data-dropboard]");
document.addEventListener("dragover",e=>{if(!drag)return;const t=tgtOf(e);if(!t)return;e.preventDefault();clearDrop();t.classList.add("drop");
  if(t.dataset.col){const kc=e.target.closest(".kc");if(kc&&kc.dataset.drag!==drag.id)kc.classList.add("ins")}});
document.addEventListener("drop",e=>{if(!drag)return;const t=tgtOf(e);if(!t)return;e.preventDefault();const {id,kind}=drag;drag=null;const tk=task(id);clearDrop();if(!tk)return;
  if(t.dataset.col){const kc=e.target.closest(".kc");moveTo(id,t.dataset.col,kc&&kc.dataset.drag!==id?kc.dataset.drag:null)}
  else if(t.dataset.cal){ui.calSel=t.dataset.cal;if(kind==="due")tk.due=t.dataset.cal;else tk.plan=t.dataset.cal;commit()}
  else if(t.dataset.tl){const r=t.getBoundingClientRect();const m0=+t.dataset.sh*60+Math.round(((e.clientY-r.top)/PXM)/15)*15;tk.plan=t.dataset.tl;tk.time=fromMin(Math.max(0,Math.min(m0,23*60+45)));commit();const cf=conflictsFor(tk);if(cf.length)toast(`Внимание: в это время пара «${cf[0].title}»`,"fish")}
  else if(t.dataset.hour){tk.plan=ui.day;tk.time=pad(t.dataset.hour)+":"+(tk.time&&tk.plan===ui.day?tk.time.slice(3):"00");commit()}
  else if(t.dataset.dropday){tk.plan=t.dataset.dropday;tk.time="";commit()}
  else if(t.dataset.dropboard){const b=board(t.dataset.dropboard);if(b&&b.id!==tk.boardId){const dn=isDone(tk);tk.boardId=b.id;tk.colId=(dn?doneCol(b):openCol(b)).id;commit();toast(`Перенесено в «${b.name}»`,"paw")}}
});

/* =================== start =================== */
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
try{takeSnap()}catch(e){}
setTimeout(cloudInit,50);
route();
if(firstRun&&state.tasks.length)setTimeout(()=>toast("Задачи перенесены из прошлой версии","cat"),400);
setInterval(()=>{if(!BK.classList.contains("show")&&ui.view==="today"&&document.activeElement.tagName!=="INPUT")render()},60000);
</script>
</body>
</html>
